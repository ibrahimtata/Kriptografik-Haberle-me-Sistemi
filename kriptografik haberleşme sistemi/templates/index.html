<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Client: Gönderici</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .container { background: white; padding: 40px; border-radius: 12px; width: 90%; max-width: 600px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); margin-bottom: 50px; }
        textarea { width: 100%; height: 100px; padding: 10px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; }
        .method-btn { display: inline-block; padding: 10px 15px; margin: 5px; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .method-btn:hover { background: #f0f0f0; }
        .method-btn.selected { background: #667eea; color: white; border-color: #5a67d8; transform: scale(1.05); }
        .btn-send { background: #28a745; color: white; border: none; padding: 15px 40px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1em; margin-top: 15px; }
        .status-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #2d3436; color: #dfe6e9; padding: 8px; font-size: 12px; display: flex; justify-content: space-between; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📤 Client: Mesaj Gönderici</h2>
        <textarea id="msg" placeholder="Mesajınızı buraya yazın..."></textarea>
        
        <div class="methods">
            <div class="method-btn" data-method="AES">AES</div>
            <div class="method-btn" data-method="MANUEL_AES">MANUEL AES</div>
            <div class="method-btn" data-method="DES">DES</div>
            <div class="method-btn" data-method="MANUEL_DES">MANUEL DES</div>
            <div class="method-btn" data-method="RSA">RSA</div>
            <div class="method-btn" data-method="ECC">ECC</div>
        </div>

        <button class="btn-send" onclick="send()">ŞİFRELE VE GÖNDER</button>
        <div id="result" style="margin-top:20px; color:#2d3436; word-break: break-all;"></div>
        
        <a href="/inbox" style="display:block; margin-top:20px; color:#667eea; font-weight:bold;">📨 Ağ Trafiğine Git (Inbox) ➔</a>
    </div>

    <div class="status-bar">
        <span>👤 <strong>ROLE:</strong> Client (Browser)</span>
        <span>🖥️ <strong>CONNECTED TO:</strong> Python Server (127.0.0.1:5000) 🟢</span>
    </div>

    <script>
        let selectedMethod = null;
        document.querySelectorAll('.method-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                selectedMethod = this.getAttribute('data-method');
            });
        });

        async function send() {
            const msg = document.getElementById('msg').value;
            if (!selectedMethod || !msg) return alert("Mesaj ve yöntem seçmelisiniz!");
            
            let url = '/encrypt';
            if (selectedMethod === 'RSA') url = '/encrypt_rsa';
            if (selectedMethod === 'ECC') url = '/encrypt_ecc';

            const res = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg, method: selectedMethod})
            });
            const data = await res.json();
            document.getElementById('result').innerHTML = `<strong>Sonuç:</strong> ${data.result.substring(0, 50)}... (Sunucuya İletildi)`;
        }
    </script>
</body>
</html>
